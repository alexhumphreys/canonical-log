name: Release

# Publishes a versioned release to Maven Central (Sonatype Central Portal) and, as a
# secondary mirror, to GitHub Maven Packages. Run on demand from the Actions tab (or
# `gh workflow run release.yml -f bump=minor`), choosing the version bump:
#   - patch: fixes, dependency bumps, docs
#   - minor: new features (any `feat:` since the last release)
#   - major: breaking changes (any `!:` / BREAKING CHANGE since the last release)
# Merging to main does not release, so one release can batch many PRs.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # axion pushes the new git tag; gh creates the GitHub release
  packages: write # publish artifacts to GitHub Packages

# Two releases at once would race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag & publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so axion can compute the version

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Main's CI already ran, but a Central release is irreversible: check the exact
      # commit being tagged before tagging it.
      - name: Build & test
        run: ./gradlew build --stacktrace

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create & push release tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            major) incrementer=incrementMajor ;;
            minor) incrementer=incrementMinor ;;
            *)     incrementer=incrementPatch ;;
          esac
          ./gradlew release \
            -Prelease.versionIncrementer="$incrementer" \
            -Prelease.disableChecks \
            --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --stacktrace

      # Uploads a signed bundle and releases it once Central's validation passes
      # (automaticRelease = true in build.gradle.kts). Irreversible: the version can never
      # be replaced or deleted, which is why this only runs when someone asks for a release.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git describe --tags --abbrev=0)
          gh release create "$tag" --title "$tag" --generate-notes --verify-tag
